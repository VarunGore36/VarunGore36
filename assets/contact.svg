<svg width="1200" height="150" viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Find Varun Gore on Discord">
  <defs><linearGradient id="contact-bg" x1="0" y1="0" x2="1200" y2="150" gradientUnits="userSpaceOnUse"><stop stop-color="#101832"/><stop offset="1" stop-color="#1C1030"/></linearGradient><linearGradient id="contact-line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#00E5B0"/><stop offset=".5" stop-color="#74A7FF"/><stop offset="1" stop-color="#D789FF"/></linearGradient></defs>
  <style>
    @keyframes ring { 0%,100% { r: 19; opacity: .7; } 50% { r: 29; opacity: 0; } }
    @keyframes typing { 0%,45% { opacity: 1; } 46%,100% { opacity: 0; } }
    .ring { animation: ring 2.1s ease-out infinite; } .cursor { animation: typing 1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .ring,.cursor { animation: none; } }
  </style>
  <rect width="1200" height="150" rx="18" fill="url(#contact-bg)"/><path d="M0 149H1200" stroke="url(#contact-line)" stroke-width="2"/>
  <circle class="ring" cx="90" cy="75" r="19" stroke="#00E5B0" stroke-width="2"/><circle cx="90" cy="75" r="11" fill="#00E5B0"/><path d="M86 70V80L96 75L86 70Z" fill="#071122"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="146" y="61" fill="#8FA3D4" font-size="12" letter-spacing="2.5">OPEN CHANNEL</text><text x="146" y="94" fill="#F0F4FF" font-size="22" font-weight="700">say hello on Discord<tspan class="cursor" fill="#00E5B0">_</tspan></text><text x="1120" y="82" fill="#AAB9DB" font-size="14" text-anchor="end">@geronimo.stilton36  ↗</text></g>
  <rect x=".5" y=".5" width="1199" height="149" rx="17.5" stroke="#C4D0FF" stroke-opacity=".14"/>
</svg>
