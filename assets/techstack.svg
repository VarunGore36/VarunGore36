<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Varun Gore — technical credits</title>
  <desc id="desc">An animated editorial poster showing Varun's systems, data, AI, and engineering technology stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#08090E"/><stop offset=".54" stop-color="#111525"/><stop offset="1" stop-color="#110918"/></linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#00E5B0"/><stop offset=".48" stop-color="#75A8FF"/><stop offset="1" stop-color="#DE8CFF"/></linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00E5B0" stop-opacity="0"/><stop offset=".4" stop-color="#00E5B0" stop-opacity=".18"/><stop offset="1" stop-color="#D789FF" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <pattern id="scan" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M0 100H100" stroke="#D4E2FF" stroke-opacity=".045"/><path d="M100 0V100" stroke="#D4E2FF" stroke-opacity=".025"/></pattern>
  </defs>
  <style>
    @keyframes scan { from { transform: translateY(-140px); } to { transform: translateY(640px); } }
    @keyframes ticker { to { stroke-dashoffset: -160; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .scanline { animation: scan 6.5s linear infinite; } .ticker { stroke-dasharray: 30 18; animation: ticker 3.6s linear infinite; } .live { animation: blink 1.4s steps(1) infinite; } .float { animation: float 4s ease-in-out infinite; } .float-late { animation-delay: 1.8s; }
    @media (prefers-reduced-motion: reduce) { .scanline,.ticker,.live,.float,.float-late { animation: none; } }
  </style>
  <rect width="1200" height="640" rx="20" fill="url(#bg)"/><rect width="1200" height="640" rx="20" fill="url(#scan)"/>
  <ellipse cx="218" cy="430" rx="280" ry="150" fill="#00E5B0" fill-opacity=".08" filter="url(#blur)"/><ellipse cx="935" cy="178" rx="270" ry="170" fill="#A46DFF" fill-opacity=".13" filter="url(#blur)"/>
  <g class="scanline" opacity=".35"><rect x="0" y="0" width="1200" height="2" fill="url(#wash)"/><rect x="0" y="5" width="1200" height="1" fill="#BFD0FF" fill-opacity=".12"/></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="62" y="63" fill="#A6B6DA" font-size="12" letter-spacing="3">TECHNICAL CREDITS / 03</text>
    <text x="1138" y="63" fill="#A6B6DA" font-size="12" letter-spacing="2" text-anchor="end">ENGINEERING, NOT AESTHETICS</text>
    <path d="M62 86H1138" stroke="#A8BBE9" stroke-opacity=".19"/><path class="ticker" d="M62 86H360" stroke="url(#flare)" stroke-width="3"/>
    <text x="58" y="263" fill="#F1F4FF" font-size="142" font-weight="700" letter-spacing="-10">RUST</text>
    <text x="66" y="310" fill="#9EAFD4" font-size="15" letter-spacing="3">THE ENGINE ROOM</text>
    <text x="68" y="348" fill="#C4D0ED" font-size="13">Tokio / Axum / SQLx / Alloy / Tungstenite</text>
    <text x="68" y="373" fill="#C4D0ED" font-size="13">rustls / zstd / criterion</text>
    <g class="float"><circle cx="62" cy="418" r="7" fill="#FF8B62"/><text x="82" y="423" fill="#FFBEA5" font-size="13" letter-spacing="2">PERFORMANCE WITH RECEIPTS</text></g>
    <text x="58" y="536" fill="#EEF3FF" font-size="50" font-weight="700" letter-spacing="-3">PYTHON / TS / SQL</text>
    <text x="61" y="569" fill="#A8B8DB" font-size="13" letter-spacing="1.4">THE GLUE, THE DATA, THE INTERFACE</text>
    <text x="62" y="601" fill="#7F93C0" font-size="11" letter-spacing="2">LINUX  ·  POSTGRESQL  ·  DOCKER  ·  GITHUB ACTIONS</text>
  </g>
  <g class="float float-late" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="700" y="154" fill="#78AFFF" font-size="12" letter-spacing="2.6">// INTELLIGENCE LAYER</text>
    <text x="700" y="194" fill="#F1F4FF" font-size="27" font-weight="700">MODEL EVALUATION</text>
    <text x="700" y="227" fill="#B8C8E9" font-size="14">vLLM · EvalPlus · MCP</text>
    <text x="700" y="252" fill="#B8C8E9" font-size="14">NumPy · Matplotlib · agent tooling</text>
    <path d="M700 278H1138" stroke="#A8BBE9" stroke-opacity=".18"/>
    <text x="700" y="330" fill="#4CF0C5" font-size="12" letter-spacing="2.6">// OBSERVE THE TRUTH</text>
    <text x="700" y="370" fill="#F1F4FF" font-size="27" font-weight="700">DATA &amp; TELEMETRY</text>
    <text x="700" y="403" fill="#B8C8E9" font-size="14">PostgreSQL · Prometheus · Grafana</text>
    <text x="700" y="428" fill="#B8C8E9" font-size="14">market data · replay · indexing</text>
    <path d="M700 454H1138" stroke="#A8BBE9" stroke-opacity=".18"/>
    <text x="700" y="506" fill="#E1A5FF" font-size="12" letter-spacing="2.6">// SHIP WITHOUT WISHFUL THINKING</text>
    <text x="700" y="546" fill="#F1F4FF" font-size="27" font-weight="700">QUALITY GATES</text>
    <text x="700" y="579" fill="#B8C8E9" font-size="14">pytest · Ruff · uv · CI · benchmarks</text>
  </g>
  <path d="M650 122V594" stroke="url(#flare)" stroke-opacity=".55"/><circle class="live" cx="650" cy="122" r="6" fill="#00E5B0"/><circle class="live" cx="650" cy="594" r="6" fill="#D789FF"/>
  <text x="672" y="617" fill="#91A4D0" font-family="ui-monospace,monospace" font-size="10" letter-spacing="2">STACK IN MOTION</text><rect x=".5" y=".5" width="1199" height="639" rx="19.5" stroke="#C6D2FF" stroke-opacity=".13"/>
</svg>
