.d1{animation-delay:.4s}.d2{animation-delay:3.2s}.d3{animation-delay:4.2s}
@keyframes fi{to{opacity:1}}
@keyframes st{to{opacity:1;letter-spacing:24px}}
@keyframes gr{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.f,.t,.r{animation:none;opacity:1;transform:none}.t{letter-spacing:24px}}
</style>
