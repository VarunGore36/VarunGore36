<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Varun Gore</title>
  <desc id="d">Infrastructure that proves its own claims</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#141b2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="round"><rect width="900" height="240" rx="14"/></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
    .l { opacity: 0; animation: cy 9s infinite; }
    .l2 { animation-delay: 3s; }
    .l3 { animation-delay: 6s; }
    @keyframes cy {
      0%   { opacity: 0; transform: translateY(6px); }
      5%, 30% { opacity: 1; transform: translateY(0); }
      35%, 100% { opacity: 0; }
    }
    .b { stroke: #2a3350; fill: #0f1626; animation: glow 6s infinite; }
    .b2 { animation-delay: 1s; }
    .b3 { animation-delay: 2s; }
    @keyframes glow {
      0%, 100% { stroke: #2a3350; fill: #0f1626; }
      12%, 35% { stroke: #5eead4; fill: #12283a; }
      55% { stroke: #2a3350; fill: #0f1626; }
    }
    @media (prefers-reduced-motion: reduce) {
      .l, .b { animation: none; }
      .l1 { opacity: 1; }
      .b { stroke: #5eead4; }
    }
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <rect width="900" height="240" fill="url(#grid)"/>
    <rect width="900" height="240" fill="url(#glow)"/>
    <rect y="236" width="900" height="4" fill="url(#accent)"/>
  </g>

  <text x="60" y="66" font-size="12" letter-spacing="3" fill="#6b7488">AI  ·  SYSTEMS  ·  INFRASTRUCTURE</text>
  <text x="60" y="126" font-size="56" font-weight="700" fill="#f0f6fc">Varun Gore</text>
  <rect x="62" y="142" width="90" height="3" rx="1.5" fill="url(#accent)"/>

  <g font-size="17" fill="#8ac7db">
    <text class="l l1" x="60" y="182"><tspan fill="#5eead4">›</tspan> Infrastructure that proves its own claims.</text>
    <text class="l l2" x="60" y="182"><tspan fill="#5eead4">›</tspan> Deterministic replay. Reproducible benchmarks.</text>
    <text class="l l3" x="60" y="182"><tspan fill="#5eead4">›</tspan> Every claim marked proven or unproven.</text>
  </g>
  <text x="60" y="212" font-size="13" fill="#6b7488">Rust  ·  Python  ·  Systems  ·  AI evaluation</text>

  <g>
    <line x1="606" y1="117" x2="635" y2="117" stroke="#5eead4" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="731" y1="117" x2="760" y2="117" stroke="#5eead4" stroke-opacity="0.7" stroke-width="2"/>
    <rect class="b b1" x="510" y="85" width="96" height="64" rx="8" stroke-width="1.5"/>
    <rect class="b b2" x="635" y="85" width="96" height="64" rx="8" stroke-width="1.5"/>
    <rect class="b b3" x="760" y="85" width="96" height="64" rx="8" stroke-width="1.5"/>
    <g font-size="15" fill="#8ac7db" text-anchor="middle">
      <text x="558" y="122">0x9f3a</text>
      <text x="683" y="122">0x41c7</text>
      <text x="808" y="122">0xb802</text>
    </g>
    <text x="510" y="182" font-size="12" fill="#6b7488">hash-chained · replayable · verifiable</text>
  </g>
</svg>
